# Test configuration
spring.main.allow-bean-definition-overriding=true

# Akka Persistence test configuration
akka.persistence.journal.plugin=akka.persistence.journal.inmem
akka.persistence.snapshot-store.plugin=akka.persistence.snapshot-store.local
akka.persistence.journal.inmem.class=akka.persistence.inmemory.journal.InMemoryJournal
akka.persistence.snapshot-store.local.class=akka.persistence.inmemory.snapshot.InMemorySnapshotStore

# Test server port
server.port=0

# Disable security for tests
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
