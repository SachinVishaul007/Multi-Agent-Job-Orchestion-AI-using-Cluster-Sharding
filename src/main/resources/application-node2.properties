# Node 2 Configuration - Processing node
# Inherits from clustered profile with node-specific overrides

# Server Configuration
server.port=8082

# Node-specific Akka Remote Configuration
akka.remote.artery.canonical.port=2552
akka.cluster.roles=["backend", "compute"]

# Connect to seed node
akka.cluster.seed-nodes=["akka://resume-search-system@127.0.0.1:2551"]

# Node identification
info.app.node=node2
info.app.role=worker

# Storage paths with node identification
resume.storage.path=./resume-data/node2
storage.path=./resume-data/node2
akka.persistence.journal.leveldb.dir="./target/journal/node2"
akka.persistence.snapshot-store.local.dir="./target/snapshots/node2"

# Logging
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [NODE2] %logger{36} - %msg%n