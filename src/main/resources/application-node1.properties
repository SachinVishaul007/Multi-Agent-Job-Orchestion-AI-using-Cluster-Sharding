# Node 1 Configuration - Main coordinator node
# Inherits from clustered profile with node-specific overrides

# Server Configuration
server.port=8081

# Node-specific Akka Remote Configuration
akka.remote.artery.canonical.port=2551
akka.cluster.roles=["frontend", "backend", "compute", "coordinator"]

# This node acts as a seed node
akka.cluster.seed-nodes=["akka://resume-search-system@127.0.0.1:2551"]

# Node identification
info.app.node=node1
info.app.role=coordinator

# Storage paths with node identification
resume.storage.path=./resume-data/node1
storage.path=./resume-data/node1
akka.persistence.journal.leveldb.dir="./target/journal/node1"
akka.persistence.snapshot-store.local.dir="./target/snapshots/node1"

# Logging
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [NODE1] %logger{36} - %msg%n