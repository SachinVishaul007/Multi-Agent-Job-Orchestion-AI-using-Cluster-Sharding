# Server Configuration


# OpenAI Configuration - API key from environment variable
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.3

# File Upload Configuration
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Local Storage
resume.storage.path=./resume-data
storage.path=./resume-data


# Akka Configuration
akka.actor.provider=local
akka.log-dead-letters=10

# Akka Persistence Configuration (in-memory for demo - replace with a real journal in production)
akka.persistence.journal.plugin = akka.persistence.journal.inmem
akka.persistence.snapshot-store.plugin = akka.persistence.snapshot-store.local

# In-memory journal (for demo only)
akka.persistence.journal.inmem.class = "akka.persistence.journal.inmem.InmemJournal"
akka.persistence.journal.inmem.store-verbose = true

# Local snapshot store (for demo only)
akka.persistence.snapshot-store.local.class = "akka.persistence.snapshot.local.LocalSnapshotStore"
akka.persistence.snapshot-store.local.dir = "./target/snapshots"
akka.log-dead-letters-during-shutdown=off

# Logging
logging.level.com.joborchestratorai.akkajoborchestratorai=INFO
logging.level.akka=INFO

google.api.key=${GOOGLE_API_KEY}
google.search.engine.id=${GOOGLE_SEARCH_ENGINE_ID}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.debug=true

# Email Sender Info
spring.mail.personal=Sachin Vishaul Baskar

# Hybrid LLM Configuration
llm.local.enabled=true
llm.local.url=http://192.168.48.1:11434
llm.local.model=phi3.5:3.8b-mini-instruct-q4_K_M
llm.local.timeout=30000
