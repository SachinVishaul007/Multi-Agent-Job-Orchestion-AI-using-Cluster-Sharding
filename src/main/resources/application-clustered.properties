# Clustered Profile Configuration
# This profile activates the distributed cluster mode with all cluster features

# Server Configuration
server.port=8080

# OpenAI Configuration - API key from environment variable
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.3

# File Upload Configuration
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Local Storage (used as fallback when cluster is unavailable)
resume.storage.path=./resume-data
storage.path=./resume-data

# Akka Cluster Configuration
akka.actor.provider=cluster
akka.log-dead-letters=10
akka.log-dead-letters-during-shutdown=off

# Cluster Settings
akka.cluster.auto-down-unreachable-after=30s
akka.cluster.seed-nodes=["akka://resume-search-system@127.0.0.1:2551"]
akka.cluster.roles=["frontend", "backend", "compute"]

# Akka Remote Configuration for Clustering
akka.remote.artery.enabled=true
akka.remote.artery.transport=tcp
akka.remote.artery.canonical.hostname=127.0.0.1
akka.remote.artery.canonical.port=2551

# Cluster Sharding Configuration
akka.cluster.sharding.number-of-shards=100
akka.cluster.sharding.guardian-name=sharding
akka.cluster.sharding.role=backend

# Akka Persistence Configuration for Event Sourcing
akka.persistence.journal.plugin=akka.persistence.journal.leveldb
akka.persistence.snapshot-store.plugin=akka.persistence.snapshot-store.local

# LevelDB Journal (production-ready)
akka.persistence.journal.leveldb.dir="./target/journal"
akka.persistence.journal.leveldb.native=false

# Local Snapshot Store
akka.persistence.snapshot-store.local.dir="./target/snapshots"

# Circuit Breaker Configuration
akka.actor.circuit-breaker.max-failures=5
akka.actor.circuit-breaker.call-timeout=10s
akka.actor.circuit-breaker.reset-timeout=30s

# Distributed Data Configuration
akka.cluster.distributed-data.role=backend
akka.cluster.distributed-data.gossip-interval=200ms
akka.cluster.distributed-data.notify-subscribers-interval=500ms

# Logging for cluster debugging
logging.level.com.joborchestratorai.akkajoborchestratorai=INFO
logging.level.akka.cluster=INFO
logging.level.akka.persistence=INFO
logging.level.akka.actor=WARN

# Google APIs
google.api.key=${GOOGLE_API_KEY}
google.search.engine.id=${GOOGLE_SEARCH_ENGINE_ID}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.debug=false

# Email Sender Info
spring.mail.personal=Sachin Vishaul Baskar

# Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics,cluster
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Application Info
info.app.name=Akka Job Orchestrator AI
info.app.description=Distributed AI-powered resume processing system with cluster sharding
info.app.version=1.0.0
info.app.profile=clustered